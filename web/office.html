<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<style>
  :root { --bg: #1b1820; --panel: #241f27; --text: #f1ebe2; --muted: #a79d93; --line: #3d332e; --accent: #8fd6b4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12px/1.35 Menlo, ui-monospace, monospace; overflow: hidden; }
  #wrap { position: absolute; inset: 0 0 var(--log-h, 92px) 0; overflow-y: auto; overflow-x: hidden; }
  canvas { display: block; image-rendering: pixelated; }
  #log { position: absolute; left: 0; right: 0; bottom: 0; height: var(--log-h, 92px);
    background: var(--panel); border-top: 3px solid var(--line); padding: 6px 10px; overflow: hidden; }
  #log .row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log .row:nth-child(n+2) { color: var(--muted); }
  #log .t { color: var(--accent); margin-right: 8px; }
  #tip { position: fixed; pointer-events: none; background: #15121aee; color: var(--text);
    border: 1px solid #5a4a3e; padding: 6px 8px; max-width: 320px; display: none;
    border-radius: 4px; z-index: 5; white-space: pre-wrap; }
  #menu { position: fixed; display: none; z-index: 6; min-width: 190px; padding: 4px;
    background: #211c24f5; border: 1px solid #5a4a3e; border-radius: 6px; box-shadow: 0 6px 20px #0008; }
  #menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text);
    font: inherit; padding: 5px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menu button:hover { background: #3a302c; }
  #menu .head { color: var(--muted); padding: 3px 8px 5px; font-size: 11px; border-bottom: 1px solid #3a302c; margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  #demo { position: fixed; bottom: calc(var(--log-h, 92px) + 4px); right: 8px; color: var(--muted); font-size: 10px; }
  #statsBtn { position: fixed; top: 6px; right: 10px; z-index: 4; font: 11px Menlo, monospace; color: var(--text);
    background: #2a2329e6; border: 1px solid #5a4a3e; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #statsBtn:hover, #chatBtn:hover { background: #3a302c; }
  #chatBtn { position: fixed; top: 6px; right: 66px; z-index: 4; font: 11px Menlo, monospace; color: var(--text);
    background: #2a2329e6; border: 1px solid #5a4a3e; border-radius: 4px; padding: 3px 8px; cursor: pointer; display: none; }
  #chatBtn.unread { border-color: #ffb347; color: #ffc370; }
  #updBtn { position: fixed; top: 6px; z-index: 4; font: 11px Menlo, monospace; color: #10241a; background: #8fd6b4;
    border: 1px solid #5fbf7f; border-radius: 4px; padding: 3px 8px; cursor: pointer; display: none; }
  #updBtn:hover { background: #a6e3c6; }
  #updBtn.busy { background: #2a2329e6; color: var(--text); border-color: #5a4a3e; cursor: progress; }
  #updBtn.failed { background: #3a2226; color: #ff9a94; border-color: #a04848; }
  #chat { position: fixed; top: 34px; right: 10px; width: min(340px, calc(100vw - 20px)); bottom: calc(var(--log-h, 92px) + 8px);
    z-index: 5; display: none; flex-direction: column; background: #1f1a22f5; border: 1px solid #4a3d36; border-radius: 8px;
    box-shadow: 0 8px 30px #0008; overflow: hidden; }
  #chat.docked { position: absolute; z-index: 2; display: flex; border-radius: 6px; box-shadow: 0 2px 0 #00000055;
    border: 2px solid #5e4232; background: #1f1a22f7; }
  #chatTab { position: absolute; z-index: 2; display: none; align-items: center; gap: 6px; font: 12px Menlo, monospace;
    color: var(--text); background: #2a2329f0; border: 2px solid #5e4232; border-right: 0; border-radius: 8px 0 0 8px;
    padding: 6px 10px 6px 8px; cursor: pointer; box-shadow: 0 2px 0 #00000055; }
  #chatTab:hover { background: #3a302c; }
  #chatTab .bell { display: inline-block; transform-origin: 50% 10%; }
  #chatTab.unread { border-color: #ffb347; color: #ffc370; }
  #chatTab.unread .bell { animation: ring 1.6s ease-in-out infinite; }
  #chatTab .n { background: #e06c6c; color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; }
  @keyframes ring { 0%, 50%, 100% { transform: rotate(0); } 10% { transform: rotate(16deg); } 20% { transform: rotate(-14deg); }
    30% { transform: rotate(10deg); } 40% { transform: rotate(-6deg); } }
  #chat .head { padding: 9px 12px; border-bottom: 1px solid #3a302c; display: flex; align-items: center; gap: 8px; }
  #chat .head b { color: #ffe7a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat .head span { color: var(--muted); font-size: 11px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat .head button { font: 11px Menlo, monospace; color: var(--text); background: #2c252b; border: 1px solid #4a3d36; border-radius: 4px; padding: 2px 7px; cursor: pointer; }
  #msgs { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 7px; }
  #msgs .m { line-height: 1.35; word-wrap: break-word; white-space: pre-wrap; }
  #msgs .m .who { font-weight: bold; margin-right: 6px; }
  #msgs .m .at { color: var(--muted); font-size: 10px; margin-left: 6px; white-space: nowrap; display: inline-block; }
  #msgs .m.mine { align-self: flex-end; background: #2d3b33; border-radius: 8px 8px 2px 8px; padding: 5px 9px; max-width: 85%; }
  #msgs .m.theirs { background: #2a2430; border-radius: 8px 8px 8px 2px; padding: 5px 9px; max-width: 85%; align-self: flex-start; }
  #msgs .m .ed { color: var(--muted); font-size: 10px; margin-left: 4px; }
  #msgs .m.deleted { color: var(--muted); font-style: italic; }
  #msgs .m .acts { display: none; margin-left: 6px; font-size: 10px; }
  #msgs .m:hover .acts, #msgs .m .acts.sure { display: inline; }
  #msgs .m .acts a { color: var(--muted); cursor: pointer; margin-left: 5px; text-decoration: underline; }
  #msgs .m .acts a:hover { color: var(--text); }
  #msgs .m .acts a.sure { color: #e06c6c; }
  #editing { display: none; align-items: center; gap: 8px; padding: 5px 10px 0; font-size: 11px; color: #8fd6b4; }
  #editing a { color: var(--muted); cursor: pointer; text-decoration: underline; }
  #msgs .empty { color: var(--muted); text-align: center; margin-top: 20px; }
  #say { display: flex; gap: 6px; padding: 9px 10px; border-top: 1px solid #3a302c; }
  #say input { flex: 1; min-width: 0; font: 12px Menlo, monospace; color: var(--text); background: #15121a; border: 1px solid #4a3d36;
    border-radius: 5px; padding: 6px 8px; outline: none; }
  #say input:focus { border-color: #8fd6b4; }
  #say button { font: 12px Menlo, monospace; color: #1b1820; background: #8fd6b4; border: 0; border-radius: 5px; padding: 0 12px; cursor: pointer; }
  #say button:disabled, #say input:disabled { opacity: .45; cursor: default; }
  #people { position: absolute; z-index: 2; display: none; flex-direction: column; overflow: hidden;
    background: #241e27f2; border: 2px solid #5e4232; border-radius: 6px; box-shadow: 0 2px 0 #00000055; }
  #people .ph { padding: 6px 8px 5px; border-bottom: 1px solid #3a302c; display: flex; align-items: center; gap: 6px; }
  #people .ph b { color: #ffe7a8; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #people .ph button { font: 11px Menlo, monospace; color: var(--text); background: #2c252b; border: 1px solid #4a3d36;
    border-radius: 4px; padding: 0 6px; cursor: pointer; line-height: 16px; }
  #people .sub { color: var(--muted); font-size: 10px; padding: 3px 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #people .list { flex: 1; overflow-y: auto; padding: 4px 4px 6px; }
  #people .p { display: flex; align-items: center; gap: 5px; padding: 3px 4px; border-radius: 4px; }
  #people .p:hover { background: #3a302c; }
  #people .p .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #people .p.me .nm { color: #9fe8b6; cursor: default; }
  #people .p.away { opacity: .55; }
  #people .p.away .dot { background: #6f665d; }
  #people .p.away .an { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #people .p.away .ago { font-size: 10px; color: var(--muted); }
  #people .p .poke { font: 11px Menlo, monospace; color: #1b1820; background: #ffc370; border: 0; border-radius: 4px;
    padding: 1px 6px; cursor: pointer; }
  #people .p .poke:disabled { background: #4a3d36; color: var(--muted); cursor: default; }
  #people .empty { color: var(--muted); font-size: 11px; padding: 6px 6px; line-height: 1.4; }
  #people .acts { display: flex; flex-direction: column; gap: 5px; padding: 8px 8px; }
  #people .acts button { font: 12px Menlo, monospace; color: #1b1820; background: #8fd6b4; border: 0; border-radius: 5px; padding: 5px 8px; cursor: pointer; }
  #people .acts button.alt { background: #2c252b; color: var(--text); border: 1px solid #4a3d36; }
  #welcome { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: #0d0b10d0; padding: 16px; }
  #welcome .card { background: var(--panel); border: 3px solid var(--line); border-radius: 8px; width: min(560px, 100%);
    max-height: 100%; overflow-y: auto; padding: 18px 22px 16px; box-shadow: 0 10px 40px #000a; }
  #welcome h1 { font-size: 17px; margin: 0 0 4px; color: var(--accent); }
  #welcome .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; line-height: 1.5; }
  #welcome ul { list-style: none; padding: 0; margin: 0 0 6px; }
  #welcome li { display: flex; gap: 10px; margin: 0 0 10px; font-size: 12px; line-height: 1.5; }
  #welcome li .i { flex: 0 0 22px; font-size: 15px; text-align: center; }
  #welcome li b { color: var(--text); }
  #welcome li span { color: var(--muted); }
  #welcome .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  #welcome button { font: 12px Menlo, monospace; border-radius: 5px; padding: 7px 12px; cursor: pointer;
    border: 1px solid #4a3d36; background: #2d2630; color: var(--text); }
  #welcome button.go { background: var(--accent); color: #1b1820; border-color: var(--accent); }
  #welcome .skip { margin-left: auto; color: var(--muted); font-size: 11px; cursor: pointer; text-decoration: underline; }
  #welcome .dots { display: flex; gap: 5px; margin-bottom: 12px; }
  #welcome .dots i { width: 18px; height: 4px; background: #3d332e; border-radius: 2px; }
  #welcome .dots i.on { background: var(--accent); }
  #stats { position: absolute; inset: 0 0 var(--log-h, 92px) 0; z-index: 3; display: none; overflow-y: auto;
    background: #1b1820fa; padding: 34px 16px 16px; }
  #stats h2 { font-size: 12px; color: var(--muted); font-weight: normal; margin: 14px 0 6px; letter-spacing: .06em; }
  #stats .cards { display: flex; gap: 10px; flex-wrap: wrap; }
  #stats .card { background: #262028; border: 1px solid #3d332e; border-radius: 6px; padding: 8px 12px; min-width: 120px; }
  #stats .card b { display: block; font-size: 18px; margin-top: 2px; }
  #stats .card small { color: var(--muted); }
  #stats table { border-collapse: collapse; width: 100%; }
  #stats th { text-align: left; color: var(--muted); font-weight: normal; padding: 4px 8px; border-bottom: 1px solid #3d332e; white-space: nowrap; }
  #stats td { padding: 5px 8px; border-bottom: 1px solid #2c2529; vertical-align: middle; white-space: nowrap; }
  #stats tr.row:hover td { background: #2a2329; cursor: pointer; }
  #stats .t { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .bar { display: inline-block; width: 70px; height: 7px; background: #3a3036; border-radius: 4px; vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
  #stats .note { color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="log"></div>
<div id="tip"></div>
<div id="menu"></div>
<div id="demo"></div>
<button id="statsBtn" title="Usage and session details (S)">Stats</button>
<button id="chatBtn" title="The shared room's chat (C)">Chat</button>
<button id="updBtn"></button>
<div id="chatTab" title="Show the chat (C)"><span class="bell">🔔</span><span>Chat</span><span class="n"></span></div>
<div id="chat"><div class="head"><b id="roomName"></b><span id="roomState"></span><button id="roomJoin" title="Look for the room now">Try now</button><button id="chatHide" title="Hide the chat (C)">Hide</button></div>
  <div id="msgs"></div>
  <div id="editing">✎ editing your message <a id="editCancel">cancel</a> <span style="color:var(--muted)">(Esc)</span></div>
  <form id="say"><input id="sayIn" maxlength="500" placeholder="Message the room…" autocomplete="off"><button>Send</button></form></div>
<div id="people"></div>
<div id="stats"></div>
<div id="welcome"><div class="card"></div></div>
<script>
// Agent Office — the view. The app calls updateOffice(snapshot) every couple of seconds; opened
// in a plain browser (no app bridge) it animates demo data. All art is drawn here, in code.
//
// Cost: at most FPS redraws a second (ENERGY_FPS with Energy saver on), none while the page is
// hidden, and at most MAX_SESSIONS sessions drawn. The rooms themselves (walls, floors, windows,
// furniture that never moves) are painted once into an offscreen layer and only repainted when
// the layout or the minute changes; a frame paints that layer plus the people.
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const tip = document.getElementById("tip"), logEl = document.getElementById("log"), wrap = document.getElementById("wrap");
const menu = document.getElementById("menu");
const P = 3;                          // one art pixel = P CSS pixels
const FPS = 6, ENERGY_FPS = 2;        // redraws per second (pixel art needs no more)
const MAX_SESSIONS = 30;              // drawn in the others room; the rest are counted
const WALK_MS = 1400;                 // walking in or out of the door
const DONE_FRESH = 30 * 60;           // "done, your turn" for this long, then plain idle
const CRASH_FRESH = 30 * 60;          // "stopped with an error" for this long, then plain idle: an error the
                                      // network caused (a Wi-Fi switch, a VPN) is not worth a "needs you" for hours
const STALL_AFTER = 10 * 60;          // working with no heartbeat this long reads as stalled
const WALL = 16;                      // height of a room's back wall, in art pixels
const SHELF_MAX = 5;                  // finished reviews on the review room's shelf, at most
let snap = null, hits = [], frame = 0, energy = false;
const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.office;
let g = ctx;                          // the canvas being painted: the screen, or the room layer

// ---------- small helpers ----------
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const SHIRTS = ["#5b8def", "#e06c6c", "#5fbf7f", "#b98be0", "#f0a35e", "#4fc1c9", "#e3c74f", "#8f9bd9", "#d77fae", "#7fbf4f"];
const HAIRS = ["#2b1d14", "#5a3a22", "#a8723e", "#1b1b22", "#d9c27a", "#7a4b2a", "#3c3c46", "#b8483a"];
const SKINS = ["#f1c9a5", "#e0ac83", "#c68b5e", "#8d5a3b", "#f5d6bd"];
const PANTS = ["#3b4258", "#4a3b35", "#2f3a3a", "#4b4b55"];
// Shirt = the team colour (one per repo folder); hair, skin and hairstyle = the individual.
function look(id, team) {
  const h = hash(id);
  return { shirt: SHIRTS[hash(team || id) % SHIRTS.length], hair: HAIRS[(h >>> 4) % HAIRS.length], skin: SKINS[(h >>> 8) % 5],
           style: (h >>> 12) % 5, pants: PANTS[(h >>> 16) % 4], seed: h };
}
function shade(hex, k) {   // k < 0 darker, k > 0 lighter
  const n = parseInt(hex.slice(1, 7), 16), f = c => Math.max(0, Math.min(255, Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k)));
  return "#" + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(c => c.toString(16).padStart(2, "0")).join("");
}
function mins(sec) { const m = Math.max(0, Math.round(sec / 60)); return m < 60 ? m + "m" : Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0"); }
function base(p) { return (p || "").split("/").filter(Boolean).slice(-2).join("/"); }
function hhmm(t) { const d = new Date(t * 1000); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function clip(s, n) { s = s || ""; return s.length > n ? s.slice(0, Math.max(1, n - 1)) + "…" : s; }
function team(cwd) { return (cwd || "").split("/").filter(Boolean).slice(0, 6).join("/"); }
// "claude-opus-5-5" → "Opus 5.5", "claude-sonnet-5-5-20261001" → "Sonnet 5.5"
function modelName(m) {
  const p = String(m || "").replace(/^claude-/, "").replace(/-\d{8}$/, "").replace(/\[.*\]$/, "").split("-");
  if (!p[0]) return "";
  return p[0][0].toUpperCase() + p[0].slice(1) + (p.length > 1 ? " " + p.slice(1).join(".") : "");
}
const ORIGIN = { terminal: "Terminal", iterm: "iTerm", "vscode-terminal": "VS Code terminal", "vscode-panel": "VS Code panel",
                 desktop: "Claude app", headless: "headless", other: "a terminal" };
const AGENT_COLOR = { running: "#5fbf7f", waiting: "#ffb347", pending: "#8ea3ad", idle: "#9a94ad", failed: "#e06c6c" };
function ctxColor(p) { return p >= 85 ? "#e06c6c" : p >= 60 ? "#f0a35e" : "#5fbf7f"; }
// A session's subagents: the hook's list (it knows the moment one starts or stops), with each
// one's exact status from the companion mod when it reports; agents only the mod knows are added.
function agentsOf(s) {
  const out = Object.entries(s.subagents || {}).map(([id, a]) => ({ id, type: a.type || "agent", status: null }));
  const live = s.live && Array.isArray(s.live.agents) ? s.live.agents : null;
  if (!live) return out;
  const byId = new Map(live.map(a => [a.id, a]));
  for (const a of out) if (byId.has(a.id)) { a.status = byId.get(a.id).status; a.description = byId.get(a.id).description; }
  for (const a of live) if (!out.some(o => o.id === a.id) && ["running", "waiting", "pending"].includes(a.status))
    out.push({ id: a.id, type: a.type || "agent", status: a.status, description: a.description });
  return out.filter(a => a.status !== "completed" && a.status !== "killed");
}
function esc(s) { return String(s).replace(/[<&"]/g, c => ({ "<": "&lt;", "&": "&amp;", '"': "&quot;" })[c]); }

// What a session shows: its recorded state, with time taken into account.
function shown(s) {
  if (s.state === "working" && s.beat && snap.now - s.beat > STALL_AFTER) return "stalled";
  if (s.state === "done" && s.since && snap.now - s.since > DONE_FRESH) return "idle";
  if (s.state === "crashed" && s.since && snap.now - s.since > CRASH_FRESH) return "idle";
  return s.state || "idle";
}

// ---------- hidden agents ----------
// Right-click → "Hide from view" stores the session's state and since. It stays hidden while both
// are unchanged; the moment the session does something new (you send it a message, it asks for a
// permission, its turn ends, it errors) the state changes and it walks back in. A hidden session
// that ends is forgotten. The list lives in the app's preferences (in a browser: localStorage).
let hidden = {}, hiddenLoaded = false;
function saveHidden() {
  const s = JSON.stringify(hidden);
  if (bridge) bridge.postMessage({ hidden: s }); else try { localStorage.setItem("agentOffice.hidden", s); } catch (e) {}
}
function loadHidden(raw) {
  if (hiddenLoaded) return; hiddenLoaded = true;
  try { hidden = JSON.parse(bridge ? (raw.hidden || "{}") : (localStorage.getItem("agentOffice.hidden") || "{}")) || {}; } catch (e) { hidden = {}; }
}
// release = the same, but the agent goes to the lounge and its desk is emptied
function hideSession(s, release) { hidden[s.id] = { state: s.state || "", since: s.since || 0, title: s.title || "", release: !!release }; saveHidden(); refresh(); }
function backToDesk(s) { delete hidden[s.id]; saveHidden(); refresh(); }
function unhideAll() { for (const id of Object.keys(hidden)) if (!hidden[id].release) delete hidden[id]; saveHidden(); refresh(); }

// pr-watch's log line → { t, repo, id, pr, event, fields }, or null. After the event, optional
// " | key: value" fields say how a finished review went: "… posted comment | result: No blockers | cost: $0.62"
function reviewLine(line) {
  const m = line.match(/^(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d) \[pr-watch\] ([\w.-]+)#(\d+):? ?(.*)$/); if (!m) return null;
  const [event, ...rest] = m[4].split(" | "), fields = {};
  for (const f of rest) { const k = f.indexOf(":"); if (k > 0) fields[f.slice(0, k).trim().toLowerCase()] = f.slice(k + 1).trim(); }
  return { t: Date.parse(m[1].replace(" ", "T")) / 1000, repo: m[2], id: m[3], pr: m[2] + "#" + m[3], event, fields };
}
// a finished review: posted, handed to you on Slack, rejected on Slack, or failed
function finishedKind(event) {
  return /^FAILED/.test(event) ? "failed" : /posted comment/.test(event) ? "posted"
    : /asked you on Slack/.test(event) ? "asked" : /rejected on Slack/.test(event) ? "rejected" : "";
}
// pr-watch's log line → a general event, or null
function reviewEvent(line) {
  const r = reviewLine(line); if (!r) return null;
  const t = r.t, msg = r.event, pr = r.pr;
  const rules = [
    [/review started/, "🔍 review started"], [/posted comment/, "📝 review posted"],
    [/Slack notified \(safe\)/, "✅ safe to merge"], [/Slack notified \(nits\)/, "🟢 safe, nits only"],
    [/FAILED, temporary/, "↻ review hit a network error, will retry"], [/FAILED/, "⚠️ review failed"],
    [/only a sync/, "↔ only a main sync, not re-reviewed"], [/you approved it/, "👍 approved by you, skipped"],
